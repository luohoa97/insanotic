// Insanotic for Android, settings update 2 (runs once): CPU side performance
// preset. Measured on an Adreno 750 phone: 92 fps at render scale 1, 0.75 and
// 0.5, so the limit is draw calls / CPU, not fill rate. Resets the earlier
// render scale experiment (FBO + dynamic resolution) and trims entity,
// particle and decal work.
seta r_viewfbo 0
seta r_viewscale 1
seta r_viewscale_fpsscaling 0
seta cl_particles_quality 0.4
seta gl_flashblend 1
seta r_coronas 0
seta r_shadow_realtime_dlight 0
seta r_shadow_realtime_world 0
seta r_bloom 0
seta r_motionblur 0

// the Adreno 750 phone does 92 fps at any render scale, so the limit is CPU/draw
// calls, not fill rate: no FBO (it costs a blit) and fewer entity/decal draws
seta cl_playerdetailreduction 4
seta cl_decals_max 100
seta r_drawparticles_drawdistance 600
seta r_drawdecals_drawdistance 200
