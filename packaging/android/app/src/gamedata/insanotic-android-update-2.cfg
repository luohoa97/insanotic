// Insanotic for Android, settings update 2 (runs once): performance preset
// for high refresh tablets (target: 100+ fps on a Xiaomi Pad 5). Renders the
// 3D view at 75% resolution, cheaper particles and flashes.
seta r_viewfbo 1
seta r_viewscale 0.75
seta cl_particles_quality 0.4
seta gl_flashblend 1
seta r_coronas 0
seta r_shadow_realtime_dlight 0
seta r_shadow_realtime_world 0
seta r_bloom 0
seta r_motionblur 0
