// Insanotic for Android, settings update 1 (runs once, see GameActivity):
// portals (warpzones) are see-through only with r_water, which the first
// defaults had switched off. Only portals and cameras, not water
// reflections, at half resolution: cheap on phones.
seta r_water 1
seta r_water_cameraentitiesonly 1
seta r_water_resolutionmultiplier 0.5
