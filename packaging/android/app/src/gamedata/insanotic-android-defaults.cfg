// Insanotic for Android: first-launch defaults, executed once when the user
// has no config.cfg yet. They are plain seta lines so they are saved and can
// be changed afterwards from the menu or the console.

// GLES2 on a phone GPU: switch off the expensive renderer features
seta r_bloom 0
// r_water renders through portals (warpzones), which are see-through only
// with it; r_water_cameraentitiesonly limits it to portals and cameras (no
// water reflections), cheap enough for phones
seta r_water 1
seta r_water_cameraentitiesonly 1
seta r_water_resolutionmultiplier 0.5
seta r_motionblur 0
seta r_coronas 0
seta r_glsl_deluxemapping 0
seta r_shadow_realtime_dlight 0
seta r_shadow_realtime_world 0
// render the 3D view at 75% of the panel resolution and scale it up: fill
// rate is the first wall on a 2560x1600 tablet (HUD stays native)
seta r_viewfbo 1
seta r_viewscale 0.75
seta r_depthfirst 0

// half size textures and fewer particles keep memory and fill rate sane
seta gl_picmip 1
seta cl_decals_max 200
seta cl_particles_quality 0.4
seta gl_flashblend 1
seta gl_texturecompression 0

// on-screen controls (see touch_controls in data/insanotic.pk3dir/mods)
seta touch_controls_force 0
