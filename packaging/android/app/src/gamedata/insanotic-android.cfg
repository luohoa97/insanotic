// Insanotic for Android: settings applied on EVERY launch (the app passes
// +exec insanotic-android.cfg). Things the user is meant to change live in
// insanotic-android-defaults.cfg, which only runs on the first launch.

// the activity owns the surface: always full screen at the panel's own
// resolution, never a resizable or decorated window
vid_fullscreen 1
vid_desktopfullscreen 1
vid_resizable 0

// touch input: no mouse grab, finger events go to the touch_controls Lua
// mod (data/insanotic.pk3dir/mods/touch_controls). The engine already forces
// vid_touchscreen 1 on Android; the touch HUD of the old Quake touch code is
// not used.
vid_touchscreen 1

// phones throttle hard: never let the frame rate run away
vid_vsync 1
cl_maxfps 60

// some textures (the particle font, for one) exist only as DDS in the game
// packs, so DDS loading must stay on; a saved r_texture_dds_load 0 from an
// older build is overridden here
r_texture_dds_load 1

// low sound latency: mix 50 ms ahead instead of 150 ms (the SDL device
// buffer is small on Android too, see snd_sdl.c)
_snd_mixahead 0.05

// touch HUD layout: the on-screen controls own the bottom and the sides.
// No ranking panel in the top right (TAB shows the scoreboard); chat takes
// its place, kill messages go top left under MENU / CHAT / TAB.
hud_panel_score 0
// the touch controls draw their own, bigger weapon bar (tap to select)
hud_panel_weapons 0
hud_panel_chat_pos "0.640000 0.020000"
hud_panel_chat_size "0.340000 0.200000"
hud_panel_notify_pos "0.010000 0.110000"
hud_panel_notify_size "0.280000 0.160000"

// a compact scoreboard for small screens: name, kills, deaths, the game
// mode's objective (caps, laps, ...) and score; no ping, packet loss, fps,
// damage or suicides, and no accuracy or item panels below it
scoreboard_columns "name | -teams,rc,cts,surv,inv,lms/kills +ft,tdm,tmayhem/kills ?+rc,inv/kills -teams,surv,lms/deaths +ft,tdm,tmayhem/deaths +ctf/caps +ons/caps +kh/caps +lms/lives ?+rc/laps +rc,cts/fastest +as/objectives +nb/goals +ft/revivals +dom/ticks -lms,rc,cts,inv,nb/score"
hud_panel_scoreboard_accuracy 0
hud_panel_scoreboard_itemstats 0
