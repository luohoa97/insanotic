# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the Flatpak bundle when a version tag (v*) is pushed and attaches it
# to the GitHub release of that tag. The manifest builds the launcher from this
# repository and fetches the engine (insanotic-darkplaces) and the game data
# (insanotic-data) from their own repositories, branch main.
name: Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: insanotic.flatpak
          manifest-path: packaging/flatpak/io.github.luohoa97.Insanotic.yml
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache: false

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: insanotic.flatpak
          generate_release_notes: true
