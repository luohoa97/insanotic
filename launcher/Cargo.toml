[package]
name = "insanotic-launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Desktop launcher for Insanotic, a Xonotic fork with Lua scripting"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
